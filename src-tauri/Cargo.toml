[package]
name = "tool-time"
version = "0.1.0"
license = "MIT"
description = "番茄日历：专注、心情、日记"
authors = ["infinater"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tool_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# 关闭调试符号：MSVC 在编译 sqlite3.c 这类超长命令行时会报 D8050，
# 且能显著加快本地增量编译；需要断点时临时改成 1。
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
